<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#8b5cf6" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Monogram Logo: N & K Futuristic Fusion -->
  <g filter="url(#glow)">
    <!-- Left vertical bar of N -->
    <path d="M140 136 L180 136 L180 376 L140 376 Z" fill="url(#neonGrad)" />
    
    <!-- Diagonal of N -->
    <path d="M180 136 L300 376 L340 376 L220 136 Z" fill="url(#neonGrad)" />
    
    <!-- Right vertical of N / K's backbone -->
    <path d="M300 136 L340 136 L340 376 L300 376 Z" fill="url(#neonGrad)" />

    <!-- K upper diagonal branch -->
    <path d="M260 256 L376 136 L424 136 L300 262 Z" fill="#10b981" />

    <!-- K lower diagonal branch -->
    <path d="M285 240 L424 376 L372 376 L246 250 Z" fill="#8b5cf6" />
  </g>

  <!-- Glowing core chip point -->
  <circle cx="256" cy="256" r="9" fill="#34d399" />
</svg>
